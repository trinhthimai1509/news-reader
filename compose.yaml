# Docker logs: at most 3 files of 10 MB per container (json-file rotates
# them), so logs cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# RAM limits measured for a 1 GB VPS (docs/DANH-GIA-VPS.md): peak use was
# ~77 MiB for PostgreSQL and ~14 MiB for the app with the real data, ~240 MiB
# for PostgreSQL with 300k articles. Raise them in .env on a bigger machine
# (2 GB VPS: DB_MEM_LIMIT=768m, APP_MEM_LIMIT=384m). A container above its
# limit is stopped by the kernel (OOM) and restarted (restart: unless-stopped).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # No published port: PostgreSQL is only reachable from the app container.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U news -d news']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: ${DB_MEM_LIMIT:-384m}
    logging: *logging
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://news:${POSTGRES_PASSWORD}@db:5432/news?sslmode=disable
      POLL_INTERVAL: ${POLL_INTERVAL:-2m}
      FULL_TEXT_ENABLED: ${FULL_TEXT_ENABLED:-true}
      LISTEN_ADDR: ':8080'
      # Admin session cookie. COOKIE_SECURE=true whenever the app is served
      # over HTTPS (reverse proxy); keep false only for http://127.0.0.1.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-12h}
      ADMIN_SESSION_IDLE: ${ADMIN_SESSION_IDLE:-2h}
      REPORT_EMAIL: ${REPORT_EMAIL:-}
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: ${APP_MEM_LIMIT:-192m}
    logging: *logging
    restart: unless-stopped
volumes:
  pgdata:
